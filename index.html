<script>
// ── blink (UNCHANGED) ──
function blink(){
  const cS=7,oS=12,cD=70,oD=150,mR=14; let f=0;
  const eyes=[{top:'lidLtop',bot:'lidLbot',cx:84,eT:72,eB:100},{top:'lidRtop',bot:'lidRbot',cx:136,eT:72,eB:100}];
  const eI=t=>t*t*t, eO=t=>1-Math.pow(1-t,2.5);
  function sl(p){const ry=p*mR;eyes.forEach(e=>{const tl=document.getElementById(e.top),bl=document.getElementById(e.bot);if(!tl||!bl)return;tl.setAttribute('rx',15);tl.setAttribute('ry',ry);tl.setAttribute('cx',e.cx);tl.setAttribute('cy',e.eT+ry);bl.setAttribute('rx',15);bl.setAttribute('ry',ry*.6);bl.setAttribute('cx',e.cx);bl.setAttribute('cy',e.eB-ry*.6);});}
  const ci=setInterval(()=>{f++;sl(eI(f/cS));if(f>=cS){clearInterval(ci);f=0;setTimeout(()=>{const oi=setInterval(()=>{f++;sl(eO(1-f/oS));if(f>=oS){clearInterval(oi);sl(0);setTimeout(blink,2800+Math.random()*3500);}},oD/oS);},45);}},cD/cS);
}
setTimeout(blink,2000);

// ── HOOVER MESSAGES (NEW SYSTEM) ──
const messages = [
  "Hi there! 👋 I'm CLEO — your assistant ✨",
  "Need a hand with anything?",
  "I'm here if you're exploring something.",
  "Hello again 👀",
  "What are we working on today?",
  "I’ve got you covered.",
  "Ask me anything."
];

let lastIndex = -1;

// ── TYPING STATE ──
let segMap = [];
let charIdx = 0;
let typingTimer = null;

const bubble = document.getElementById('chatBubble');
const cleoEl = document.getElementById('cleoInner');
const typed = document.getElementById('typedText');
const cursor = document.getElementById('cursor');

function resetTyping(){
  clearTimeout(typingTimer);
  typed.innerHTML = "";
  typed.appendChild(cursor);
  cursor.style.display = "inline-block";
  segMap = [];
  charIdx = 0;
}

function buildMessage(text){
  resetTyping();
  segMap = [...text];
}

function typeNext(){
  if(charIdx >= segMap.length){
    cursor.style.display = "none";
    return;
  }

  const ch = segMap[charIdx++];

  const span = document.createElement("span");
  span.textContent = ch;

  typed.insertBefore(span, cursor);

  typingTimer = setTimeout(typeNext, 22 + Math.random()*28);
}

// ── POSITION (UNCHANGED LOGIC) ──
function positionBubble(){
  const r = cleoEl.getBoundingClientRect();
  bubble.style.left = (r.right + 12) + 'px';
  bubble.style.top  = (r.top + r.height/2 - 100) + 'px';
}

// ── SHOW / HIDE (UPDATED ONLY LOGIC) ──
let hideTimer;

function showBubble(){
  clearTimeout(hideTimer);

  positionBubble();
  bubble.classList.add('show');

  // pick new message every hover (no repeat)
  let idx = Math.floor(Math.random() * messages.length);
  if(messages.length > 1){
    while(idx === lastIndex){
      idx = Math.floor(Math.random() * messages.length);
    }
  }
  lastIndex = idx;

  buildMessage(messages[idx]);

  setTimeout(typeNext, 250);
}

function hideBubble(){
  hideTimer = setTimeout(()=>{
    bubble.classList.remove('show');
  }, 500);
}

// ── EVENTS (UNCHANGED) ──
cleoEl.addEventListener('mouseenter', showBubble);
cleoEl.addEventListener('mouseleave', hideBubble);
bubble.addEventListener('mouseenter', ()=>clearTimeout(hideTimer));
bubble.addEventListener('mouseleave', hideBubble);
</script>
