<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEO Mascot Widget - Right Side Wave</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Base Reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent !important;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Core Container Context */
.widget-wrapper {
  position: relative;
  display: inline-block;
  padding: 40px;
  min-width: 540px; 
  min-height: 360px;
}

/* Mascot Container Configuration */
.cleo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  animation: robotHover 4.5s ease-in-out infinite;
  position: absolute;
  left: 40px;
  top: 40px;
  z-index: 10;
  width: 130px; 
}

@keyframes robotHover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.cleo-svg-wrap {
  filter: drop-shadow(0 16px 36px rgba(0, 180, 255, 0.3));
  width: 100%;
}

/* NATURAL HAND MOVEMENT FOR "HI" (OPPOSITE SIDE / RIGHT ARM)
  The transform origin is set right at the right shoulder joint (164px, 172px).
  Positive rotation values sweep the hand outwards into the open right area.
*/
.right-arm-group {
  transform-origin: 164px 172px;
  transform: rotate(0deg);
  transition: transform 0.25s ease-out;
}

.widget-wrapper:hover .right-arm-group {
  animation: naturalRightOutwardWave 1.3s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
}

@keyframes naturalRightOutwardWave {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(52deg); }
  40% { transform: rotate(34deg); }
  60% { transform: rotate(58deg); }
  80% { transform: rotate(34deg); }
}

.cleo-name {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.4);
  margin-top: 8px;
}
.cleo-name span {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .1em;
  color: #00dcff;
}

/* Modern Dialogue Panel */
.chat-bubble {
  position: absolute;
  left: 176px; 
  top: 80px;   
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-left: 2px solid #00dcff; 
  border-radius: 12px;
  padding: 14px 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  width: max-content;
  min-width: 80px;
  max-width: 320px;
  min-height: 56px;
  z-index: 5;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.45;
  color: #e2f7ff;
  letter-spacing: -0.01em;
  opacity: 0;
  transform: scaleX(0.88) translateX(-6px);
  transform-origin: left center;
  transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}

.chat-bubble .tech-highlight {
  color: #00dcff;
  font-weight: 600;
  text-shadow: 0 0 8px rgba(0, 220, 255, 0.4);
}

.widget-wrapper:hover .chat-bubble {
  opacity: 1;
  transform: scaleX(1) translateX(0px);
}

#cursor {
  display: inline-block;
  width: 2px;
  height: 14px;
  background: #00dcff;
  margin-left: 4px;
  animation: smoothPulse 0.8s ease-in-out infinite;
  vertical-align: middle;
}
@keyframes smoothPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
</style>
</head>
