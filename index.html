<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEO Dual-Mood Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
/* Reset & Canvas Layout */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent !important;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

/* Master Widget Boundary */
.widget-wrapper {
  position: relative;
  display: inline-block;
  padding: 40px;
  min-width: 580px; 
  min-height: 380px;
}

/* CLEO Body Container */
.cleo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  position: absolute;
  left: 30px; 
  top: 40px;
  z-index: 10;
  width: 170px; 
  transform-origin: bottom center;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Clean Idle State - ONLY animates when NOT hovered */
.widget-wrapper:not(:hover) .cleo-container {
  animation: robotHover 4s ease-in-out infinite;
}
@keyframes robotHover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* Base Hover Scale & Slight Lean */
.widget-wrapper:hover .cleo-container {
  transform: scale(1.04) rotate(3deg);
}

/* Global SVG wrapper transition */
.cleo-svg-wrap {
  width: 100%;
  transition: filter 0.3s ease;
}

/* Transform Origin Anchors for Robot Arms */
.left-side-arm-group { 
  transform-origin: 92px 178px; 
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); 
}
.right-side-arm-group { 
  transform-origin: 188px 178px; 
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); 
}

/* --- CHEEKY MODE TRANSITIONS --- */
.widget-wrapper.mode-cheeky .left-side-arm-group {
  animation: cheekyWave 0.4s ease-in-out infinite alternate;
}
@keyframes cheekyWave {
  0% { transform: rotate(10deg); }
  100% { transform: rotate(45deg); }
}
.widget-wrapper.mode-cheeky .right-side-arm-group {
  transform: rotate(-20deg) translateX(-2px);
}

/* --- PANIC MODE TRANSITIONS --- */
.widget-wrapper.mode-panic .cleo-container {
  animation: panicShake 0.1s linear infinite !important;
}
@keyframes panicShake {
  0%, 100% { transform: translate(1px, 1px) rotate(3deg) scale(1.04); }
  20% { transform: translate(-2px, 0px) rotate(4deg) scale(1.04); }
  40% { transform: translate(1px, -1px) rotate(2deg) scale(1.04); }
  60% { transform: translate(-2px, 1px) rotate(3deg) scale(1.04); }
  80% { transform: translate(-1px, -1px) rotate(4deg) scale(1.04); }
}
.widget-wrapper.mode-panic .left-side-arm-group {
  animation: flailLeft 0.12s ease-in-out infinite alternate !important;
}
@keyframes flailLeft {
  0% { transform: rotate(-5deg); }
  100% { transform: rotate(65deg); }
}
.widget-wrapper.mode-panic .right-side-arm-group {
  animation: flailRight 0.12s ease-in-out infinite alternate !important;
}
@keyframes flailRight {
  0% { transform: rotate(10deg); }
  100% { transform: rotate(-55deg); }
}

/* Morphable SVG Elements transition maps */
#visorBg, #robotMouth, #eyeLeftIris, #eyeRightIris {
  transition: fill 0.25s ease, stroke 0.25s ease, d 0.25s ease;
}

/* --- TEXT SPEECH BUBBLE --- */
.chat-bubble {
  position: absolute;
  left: 195px; 
  top: 65px;   
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  border-top: 1.5px solid rgba(255, 255, 255, 0.4);
  border-left: 1.5px solid rgba(255, 255, 255, 0.3);
  border-radius: 16px;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  width: max-content;
  max-width: 320px;
  min-height: 60px;
  z-index: 5;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.5;
  opacity: 0;
  transform: scale(0.9) translateX(-10px);
  transform-origin: left center;
  transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}
.chat-bubble::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 22px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  transition: border-right 0.25s ease;
}

.bubble-cheeky {
  background: linear-gradient(135deg, rgba(255, 245, 230, 0.15) 0%, rgba(35, 20, 5, 0.5) 100%);
  border: 1px solid rgba(255, 170, 0, 0.3);
  box-shadow: 0 20px 40px rgba(25, 10, 0, 0.45), 0 0 20px rgba(255, 170, 0, 0.15);
  color: #fffaf0;
}
.bubble-cheeky::before { border-right: 8px solid rgba(255, 170, 0, 0.3); }

.bubble-panic {
  background: linear-gradient(135deg, rgba(255, 230, 230, 0.12) 0%, rgba(45, 5, 5, 0.55) 100%);
  border: 1px solid rgba(255, 60, 60, 0.35);
  box-shadow: 0 20px 40px rgba(35, 0, 0, 0.5), 0 0 20px rgba(255, 50, 50, 0.2);
  color: #fff0f0;
}
.bubble-panic::before { border-right: 8px solid rgba(255, 60, 60, 0.35); }

/* Reveal speech bubble on hover wrapper */
.widget-wrapper:hover .chat-bubble {
  opacity: 1;
  transform: scale(1) translateX(0px);
}

/* Typing Terminal Utilities */
#cursor {
  display: inline-block;
  width: 2px;
  height: 14px;
  margin-left: 4px;
  animation: dynamicPulse 0.6s infinite;
  vertical-align: middle;
}
@keyframes dynamicPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.text-highlight-cheeky { color: #ffaa00; font-weight: 700; }
.text-highlight-panic { color: #ff3b3b; font-weight: 700; }

.spark {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  z-index: 15;
}
</style>
</head>
<body>

<div class="widget-wrapper" id="cleoWidget">
  
  <!-- Robot Container Unit -->
  <div class="cleo-container" id="cleoContainer">
    <div class="cleo-svg-wrap" id="cleoGlowWrap">
      <svg viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%">
        <defs>
          <!-- Baseline Assets definitions -->
          <radialGradient id="bG" cx="38%" cy="28%" r="68%">
            <stop offset="0%" stop-color="#f2fbff"/>
            <stop offset="50%" stop-color="#cfeaf8"/>
            <stop offset="100%" stop-color="#8fc6e6"/>
          </radialGradient>
          <radialGradient id="hG" cx="36%" cy="26%" r="68%">
            <stop offset="0%" stop-color="#f4fcff"/>
            <stop offset="45%" stop-color="#bce3f8"/>
            <stop offset="100%" stop-color="#73bae2"/>
          </radialGradient>
          <radialGradient id="vG" gradientUnits="userSpaceOnUse" cx="122" cy="70" r="96">
            <stop offset="0%" stop-color="#1f63a8"/>
            <stop offset="50%" stop-color="#093058"/>
            <stop offset="100%" stop-color="#03102a"/>
          </radialGradient>
          <radialGradient id="gG" cx="35%" cy="28%" r="65%">
            <stop offset="0%" stop-color="#ffe080"/>
            <stop offset="100%" stop-color="#c87800"/>
          </radialGradient>
          <radialGradient id="rG" cx="40%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ff8a98"/>
            <stop offset="100%" stop-color="#d23344"/>
          </radialGradient>
          <linearGradient id="glG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,.55)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="rgba(0,0,0,.32)"/></filter>
          <filter id="sh2"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,.22)"/></filter>
        </defs>

        <!-- Dynamic Drop ground shadow -->
        <ellipse cx="140" cy="274" rx="50" ry="7" fill="rgba(0,180,255,.12)"></ellipse>

        <!-- Torso Core Matrix -->
        <path d="M85 168 Q80 232 82 268 L198 268 Q200 232 195 168 Q178 154 140 152 Q102 154 85 168Z" fill="url(#bG)" filter="url(#sh)"/>
        <path d="M102 158 Q140 150 178 158 Q172 172 140 174 Q108 172 102 158Z" fill="url(#glG)" opacity=".5"/>
        
        <circle cx="114" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
        <circle cx="140" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
        <circle cx="166" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
        
        <rect x="112" y="234" width="56" height="20" rx="8" fill="rgba(0,100,200,.25)" stroke="rgba(0,220,255,.5)" stroke-width="1"/>
        <text x="140" y="248" text-anchor="middle" font-family="'Syne',sans-serif" font-size="9" font-weight="800" fill="#00dcff" letter-spacing="2.5">CLEO</text>

        <!-- Left Arm Element -->
        <g id="leftSideArm" class="left-side-arm-group">
          <path d="M87 170 Q60 188 56 220 Q54 238 64 242 Q76 246 82 230 Q88 212 98 186Z" fill="url(#bG)" filter="url(#sh2)"/>
          <ellipse cx="62" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)"/>
        </g>

        <!-- Right Arm Element -->
        <g id="rightSideArm" class="right-side-arm-group">
          <path d="M193 170 Q220 188 224 220 Q226 238 216 242 Q204 246 198 230 Q192 212 182 186Z" fill="url(#bG)" filter="url(#sh2)"/>
          <ellipse cx="218" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)"/>
        </g>

        <!-- Neck Joint -->
        <ellipse cx="140" cy="153" rx="24" ry="6" fill="url(#gG)" filter="url(#sh2)"/>
        <rect x="124" y="134" width="32" height="22" rx="11" fill="url(#bG)" filter="url(#sh2)"/>

        <!-- Facial Structure Base -->
        <ellipse cx="140" cy="80" rx="71" ry="67" fill="url(#hG)" filter="url(#sh)"/>
        <ellipse cx="69" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/>
        <ellipse cx="211" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/>

        <!-- Visor Glass Area -->
        <rect id="visorBg" x="78" y="54" width="124" height="62" rx="28" fill="url(#vG)"/>

        <!-- Eyes Node Matrix -->
        <g id="eyeGroup">
          <ellipse cx="114" cy="86" rx="15" ry="14" fill="white"/>
          <circle cx="114" cy="86" r="6" fill="#03102a" id="eyeLeftIris"/>
          <circle cx="116.5" cy="83" r="2.5" fill="white"/>

          <ellipse cx="166" cy="86" rx="15" ry="14" fill="white"/>
          <circle cx="166" cy="86" r="6" fill="#03102a" id="eyeRightIris"/>
          <circle cx="169.5" cy="83" r="2.5" fill="white"/>
        </g>

        <!-- Digital Mouth Stroke Line -->
        <path id="robotMouth" d="M130 104 Q140 112 150 104" stroke="#5ef0ff" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  </div>

  <!-- Dynamic Chat Interface Overlay -->
  <div class="chat-bubble" id="chatBubble">
    <span id="typedText"><span id="cursor"></span></span>
  </div>

</div>

<script>
const moods = [
  {
    name: "cheeky",
    wrapperClass: "mode-cheeky",
    visorFill: "#261c08",
    mouthD: "M132 101 Q140 109 148 101",
    mouthStroke: "#ffaa00",
    irisFill: "#261c08",
    glowFilter: "drop-shadow(0 16px 36px rgba(255, 170, 0, 0.25))",
    bubbleClass: "bubble-cheeky",
    cursorColor: "#ffaa00",
    phrases: [
      "Done or not? Don't wait until boss come after you, hehehehe... 🫣",
      "Are we working hard or hardly working over here? 👀",
      "I won't tell management if you switch tabs back to work right now. 🤫"
    ]
  },
  {
    name: "panic",
    wrapperClass: "mode-panic",
    visorFill: "#4a0808",
    mouthD: "M130 106 L150 106",
    mouthStroke: "#ff3b3b",
    irisFill: "#050200",
    glowFilter: "drop-shadow(0 16px 36px rgba(255, 50, 50, 0.5))",
    bubbleClass: "bubble-panic",
    cursorColor: "#ff3b3b",
    phrases: [
      "ERROR 404: Sleep metric not found. Send coffee immediately! ☕",
      "Compliance overload! Too many requests! Dramatic meltdown initialized! 💥",
      "Warning: Human interaction threshold exceeded. Executing panic routine!"
    ]
  }
];

let currentMoodIdx = 0;
let charIdx = 0, typingTimer = null, sparkInterval = null;
let isHovered = false;

const widget = document.getElementById('cleoWidget');
const container = document.getElementById('cleoContainer');
const glowWrap = document.getElementById('cleoGlowWrap');
const visor = document.getElementById('visorBg');
const mouth = document.getElementById('robotMouth');
const leftIris = document.getElementById('eyeLeftIris');
const rightIris = document.getElementById('eyeRightIris');
const bubble = document.getElementById('chatBubble');
const typed = document.getElementById('typedText');
const cursor = document.getElementById('cursor');

// Click handler toggles internal mood state
container.addEventListener('click', (e) => {
  e.stopPropagation();
  if(!isHovered) return;
  
  currentMoodIdx = (currentMoodIdx + 1) % moods.length;
  applyMoodStyle();
  triggerTyping();
});

// Cursor Enter Sequence
widget.addEventListener('mouseenter', () => {
  isHovered = true;
  applyMoodStyle();
  triggerTyping();
});

// Cursor Exit Sequence - Total Baseline Structural Purge
widget.addEventListener('mouseleave', () => {
  isHovered = false;
  
  // Clear layout configuration context loops cleanly
  widget.className = "widget-wrapper";
  
  // Stop dynamic loops
  stopSparks();
  resetTyping();
  
  // Return SVG parameters to exact technical default state blueprint
  visor.setAttribute('fill', 'url(#vG)');
  mouth.setAttribute('d', 'M130 104 Q140 112 150 104');
  mouth.setAttribute('stroke', '#5ef0ff');
  leftIris.setAttribute('fill', '#03102a');
  rightIris.setAttribute('fill', '#03102a');
  glowWrap.style.filter = "drop-shadow(0 16px 36px rgba(0, 180, 255, 0.22))";
});

function applyMoodStyle() {
  if (!isHovered) return;
  const currentMood = moods[currentMoodIdx];

  // Scrub any lingering cross-mood classes
  widget.className = "widget-wrapper " + currentMood.wrapperClass;
  stopSparks();

  // Bind Dynamic Visual Accents
  bubble.className = `chat-bubble ${currentMood.bubbleClass}`;
  cursor.style.background = currentMood.cursorColor;
  cursor.style.boxShadow = `0 0 8px ${currentMood.cursorColor}`;

  // Update SVG Properties
  visor.setAttribute('fill', currentMood.visorFill);
  mouth.setAttribute('d', currentMood.mouthD);
  mouth.setAttribute('stroke', currentMood.mouthStroke);
  leftIris.setAttribute('fill', currentMood.irisFill);
  rightIris.setAttribute('fill', currentMood.irisFill);
  glowWrap.style.filter = currentMood.glowFilter;

  if (currentMood.name === "panic") {
    startSparks();
  }
}

function resetTyping() {
  clearTimeout(typingTimer);
  typed.innerHTML = '';
  typed.appendChild(cursor);
  charIdx = 0;
}

function triggerTyping() {
  resetTyping();
  const mood = moods[currentMoodIdx];
  const phrase = mood.phrases[Math.floor(Math.random() * mood.phrases.length)];
  typeNext(phrase, mood.name);
}

function typeNext(phrase, moodName) {
  if (!isHovered || charIdx >= phrase.length) return;
  
  const char = phrase[charIdx];
  const span = document.createElement('span');
  span.textContent = char;
  
  // Highlight target conditions
  if (moodName === "cheeky" && phrase.includes("boss") && charIdx >= 29 && charIdx <= 52) {
    span.classList.add('text-highlight-cheeky');
  } else if (moodName === "panic" && (phrase.includes("ERROR") && charIdx < 9 || phrase.includes("Warning") && charIdx < 8)) {
    span.classList.add('text-highlight-panic');
  }

  charIdx++;
  typed.insertBefore(span, cursor);
  typingTimer = setTimeout(() => typeNext(phrase, moodName), 20 + Math.random() * 15);
}

function startSparks() {
  sparkInterval = setInterval(() => {
    if(!isHovered) return;
    const spark = document.createElement('div');
    spark.className = 'spark';
    
    const randomX = 40 + Math.random() * 120;
    const randomY = 40 + Math.random() * 200;
    
    spark.style.left = `${randomX}px`;
    spark.style.top = `${randomY}px`;
    spark.style.background = Math.random() > 0.4 ? '#ff3b3b' : '#ffea00';
    spark.style.boxShadow = `0 0 6px ${spark.style.background}`;
    
    widget.appendChild(spark);
    
    const angle = Math.random() * Math.PI * 2;
    const velocity = 25 + Math.random() * 30;
    const targetX = Math.cos(angle) * velocity;
    const targetY = Math.sin(angle) * velocity;
    
    const anim = spark.animate([
      { opacity: 1, transform: 'translate(0, 0) scale(1)' },
      { opacity: 0, transform: `translate(${targetX}px, ${targetY}px) scale(0)` }
    ], { duration: 400 + Math.random() * 300, easing: 'ease-out' });
    
    anim.onfinish = () => spark.remove();
  }, 100);
}

function stopSparks() {
  clearInterval(sparkInterval);
  document.querySelectorAll('.spark').forEach(el => el.remove());
}
</script>
</body>
</html>
