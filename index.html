<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEO Mascot Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Reset and clear background for widget transparency */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent !important; /* Forces transparency for dashboard placement */
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

/* Fixed Base Wrapper */
.widget-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 340px;
  height: 380px;
}

/* True Mascot Wrapper with Hover Idle Animation Only */
.cleo-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  animation: subtleFloat 4s ease-in-out infinite;
  position: relative;
  z-index: 10;
}

/* Pure CSS floating - zero layout breaking shifts */
@keyframes subtleFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-6px) rotate(-0.5deg); }
  50% { transform: translateY(-10px) rotate(0.5deg); }
  75% { transform: translateY(-4px) rotate(-0.2deg); }
}

.cleo-svg-wrap {
  filter: drop-shadow(0 12px 28px rgba(0, 180, 255, 0.25));
  width: 130px;
}

/* Floating Chat Bubble CSS */
.chat-bubble {
  position: absolute;
  background: #091225;
  border: 1px solid rgba(0, 220, 255, 0.25);
  border-radius: 14px;
  padding: 12px 18px;
  width: 240px;
  min-height: 64px;
  font-size: 13px;
  line-height: 1.4;
  color: #ffffff;
  box-shadow: 0 8px 32px rgba(0, 180, 255, 0.2);
  
  /* Fixed positioning offset natively near his helmet */
  top: 15px;
  left: 215px;
  
  opacity: 0;
  transform: scale(0.9) translateX(-10px);
  transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
  z-index: 100;
}

/* Pop state triggered securely via CSS hover */
.widget-container:hover .chat-bubble {
  opacity: 1;
  transform: scale(1) translateX(0);
}

/* Pointer Arrow */
.chat-bubble::before {
  content: '';
  position: absolute;
  left: -8px;
  top: 30px;
  transform: translateY(-50%);
  border: 8px solid transparent;
  border-right-color: rgba(0, 220, 255, 0.25);
  border-left: 0;
}
.chat-bubble::after {
  content: '';
  position: absolute;
  left: -6.5px;
  top: 30px;
  transform: translateY(-50%);
  border: 8px solid transparent;
  border-right-color: #091225;
  border-left: 0;
}

#cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: #00dcff;
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: blinkCur .7s step-end infinite;
}
@keyframes blinkCur { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.cleo-name {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.4);
  margin-top: 4px;
}
.cleo-name span {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .1em;
  color: #00dcff;
}
</style>
</head>
<body>

<div class="widget-container" id="cleoWidget">
  
  <div class="chat-bubble" id="chatBubble">
    <span id="typedText"><span id="cursor"></span></span>
  </div>

  <div class="cleo-inner">
    <div class="cleo-svg-wrap">
      <svg viewBox="0 0 220 280" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%">
        <defs>
          <radialGradient id="bG" cx="38%" cy="28%" r="68%">

            <stop offset="50%" stop-color="#cfeaf8"/>
            <stop offset="100%" stop-color="#8fc6e6"/>
          </radialGradient>
          <radialGradient id="hG" cx="36%" cy="26%" r="68%">
            <stop offset="0%" stop-color="#f4fcff"/>
            <stop offset="45%" stop-color="#bce3f8"/>
            <stop offset="100%" stop-color="#73bae2"/>
          </radialGradient>
          <radialGradient id="vG" gradientUnits="userSpaceOnUse" cx="92" cy="70" r="96">
            <stop offset="0%" stop-color="#1f63a8"/>
            <stop offset="50%" stop-color="#093058"/>
            <stop offset="100%" stop-color="#03102a"/>
          </radialGradient>
          <radialGradient id="gG" cx="35%" cy="28%" r="65%">
            <stop offset="0%" stop-color="#ffe080"/>
            <stop offset="100%" stop-color="#c87800"/>
          </radialGradient>
          <radialGradient id="rG" cx="40%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ff8a98"/>
            <stop offset="100%" stop-color="#d23344"/>
          </radialGradient>
          <radialGradient id="ckG" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255,150,170,.75)"/>
            <stop offset="100%" stop-color="rgba(255,150,170,0)"/>
          </radialGradient>

            <stop offset="0%" stop-color="rgba(255,255,255,.55)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="rgba(0,0,0,.2)"/> </filter>
          <filter id="sh2"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,.15)"/></filter>
          <filter id="gw"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <ellipse cx="110" cy="274" rx="44" ry="6" fill="rgba(0,180,255,.15)"/>

        <line x1="110" y1="18" x2="110" y2="9" stroke="#9fd8f0" stroke-width="3" stroke-linecap="round"/>
        <circle cx="110" cy="7" r="4.5" fill="#00dcff" filter="url(#gw)"/>

        <path d="M55 168 Q50 232 52 268 L168 268 Q170 232 165 168 Q148 154 110 152 Q72 154 55 168Z" fill="url(#bG)" filter="url(#sh)"/>
        <path d="M72 158 Q110 150 148 158 Q142 172 110 174 Q78 172 72 158Z" fill="url(#glG)" opacity=".5"/>
        <path d="M64 182 Q110 174 156 182" stroke="rgba(160,240,255,.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        
        <circle cx="84" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
        <circle cx="110" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
        <circle cx="136" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
        <circle cx="81" cy="207" r="3" fill="rgba(255,255,255,.6)"/>
        <circle cx="107" cy="207" r="3" fill="rgba(255,255,255,.6)"/>
        <circle cx="133" cy="207" r="3" fill="rgba(255,255,255,.6)"/>
        
        <rect x="82" y="234" width="56" height="20" rx="8" fill="rgba(0,100,200,.25)" stroke="rgba(0,220,255,.5)" stroke-width="1"/>
        <text x="110" y="248" text-anchor="middle" font-family="'Syne',sans-serif" font-size="9" font-weight="800" fill="#00dcff" letter-spacing="2.5">CLEO</text>

        <path d="M57 170 Q30 188 26 220 Q24 238 34 242 Q46 246 52 230 Q58 212 68 186Z" fill="url(#bG)" filter="url(#sh2)"/>
        <ellipse cx="32" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)"/>
        <path d="M163 170 Q190 188 194 220 Q196 238 186 242 Q174 246 168 230 Q162 212 152 186Z" fill="url(#bG)" filter="url(#sh2)"/>
        <ellipse cx="188" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)"/>

        <ellipse cx="110" cy="153" rx="24" ry="6" fill="url(#gG)" filter="url(#sh2)"/>
        <rect x="94" y="134" width="32" height="22" rx="11" fill="url(#bG)" filter="url(#sh2)"/>

        <ellipse cx="110" cy="80" rx="71" ry="67" fill="url(#hG)" filter="url(#sh)"/>
        <ellipse cx="39" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/>
        <ellipse cx="181" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/>

        <rect x="48" y="54" width="124" height="62" rx="28" fill="url(#vG)"/>
        <rect x="48" y="54" width="124" height="62" rx="28" fill="none" stroke="rgba(120,210,255,.45)" stroke-width="1.5"/>

        <ellipse cx="66" cy="103" rx="9" ry="5.5" fill="url(#ckG)"/>
        <ellipse cx="154" cy="103" rx="9" ry="5.5" fill="url(#ckG)"/>

        <ellipse cx="84" cy="86" rx="15" ry="14" fill="white"/>
        <circle cx="84" cy="86" r="6" fill="#050200"/>
        <circle cx="87.5" cy="82" r="2.8" fill="rgba(255,255,255,.9)"/>
        <ellipse cx="84" cy="74" rx="15" ry="6" fill="rgba(0,0,0,.15)"/>

        <ellipse cx="136" cy="86" rx="15" ry="14" fill="white"/>
        <circle cx="136" cy="86" r="6" fill="#050200"/>
        <circle cx="139.5" cy="82" r="2.8" fill="rgba(255,255,255,.9)"/>
        <ellipse cx="136" cy="74" rx="15" ry="6" fill="rgba(0,0,0,.15)"/>

        <path d="M100 104 Q110 112 124 104" stroke="#5ef0ff" stroke-width="3" stroke-linecap="round" fill="none"/>

        <ellipse id="lidLtop" cx="84"  cy="86" rx="15" ry="0" fill="url(#vG)"/>
        <ellipse id="lidLbot" cx="84"  cy="86" rx="15" ry="0" fill="url(#vG)"/>
        <ellipse id="lidRtop" cx="136" cy="86" rx="15" ry="0" fill="url(#vG)"/>
        <ellipse id="lidRbot" cx="136" cy="86" rx="15" ry="0" fill="url(#vG)"/>
      </svg>
    </div>
    <div class="cleo-name"><span>CLEO</span></div>
  </div>

</div>

<script>
// --- Native Blink Loop Engine ---
function blink() {
  const cS = 7, oS = 12, cD = 70, oD = 150, mR = 14; let f = 0;
  const eyes = [
    { top: 'lidLtop', bot: 'lidLbot', cx: 84,  eT: 72, eB: 100 },
    { top: 'lidRtop', bot: 'lidRbot', cx: 136, eT: 72, eB: 100 }
  ];
  const eI = t => t*t*t, eO = t => 1-Math.pow(1-t, 2.5);
  function sl(p) {
    const ry = p * mR;
    eyes.forEach(e => {
      const tl = document.getElementById(e.top), bl = document.getElementById(e.bot);
      if(!tl || !bl) return;
      tl.setAttribute('rx', 15); tl.setAttribute('ry', ry); tl.setAttribute('cx', e.cx); tl.setAttribute('cy', e.eT + ry);
      bl.setAttribute('rx', 15); bl.setAttribute('ry', ry * 0.6); bl.setAttribute('cx', e.cx); bl.setAttribute('cy', e.eB - ry * 0.6);
    });
  }
  const ci = setInterval(() => {
    f++; sl(eI(f / cS));
    if (f >= cS) {
      clearInterval(ci); f = 0;
      setTimeout(() => {
        const oi = setInterval(() => {
          f++; sl(eO(1 - f / oS));
          if (f >= oS) { clearInterval(oi); sl(0); setTimeout(blink, 3000 + Math.random() * 3000); }
        }, oD / oS);
      }, 45);
    }
  }, cD / cS);
}
setTimeout(blink, 2000);

// --- Custom Title Typing Engine ---
const fullMessage = "CLEO Here... Compliance and Lifecycle Engagement Officer.";
let charIdx = 0, typingTimer = null;

const widget = document.getElementById('cleoWidget');
const typed = document.getElementById('typedText');
const cursor = document.getElementById('cursor');

widget.addEventListener('mouseenter', () => { triggerTyping(); });
widget.addEventListener('mouseleave', () => { resetTyping(); });

function resetTyping() {
  clearTimeout(typingTimer);
  typed.innerHTML = '';
  typed.appendChild(cursor);
  cursor.style.display = 'inline-block';
  charIdx = 0;
}

function triggerTyping() {
  resetTyping();
  setTimeout(typeNext, 200);
}

function typeNext() {
  if (charIdx >= fullMessage.length) {
    cursor.style.display = 'none';
    return;
  }
  const span = document.createElement('span');
  span.textContent = fullMessage[charIdx++];
  typed.insertBefore(span, cursor);
  typingTimer = setTimeout(typeNext, 35 + Math.random() * 25);
}
</script>
</body>
</html>
