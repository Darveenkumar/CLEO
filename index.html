<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEO</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:visible;width:100%;padding-top:50px;}

.cleo-wrap{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.cleo-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:hoverfloat 4s 1s ease-in-out infinite;
  cursor:pointer;
  width:160px;
}

@keyframes hoverfloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.cleo-svg-wrap{
  width:110px;
  filter:drop-shadow(0 8px 20px rgba(0,180,255,.35));
}

.cleo-name{
  font-family:'Syne',sans-serif;
  font-size:13px;
  letter-spacing:.1em;
  color:#00dcff;
}

/* ── BUBBLE ── */
.chat-bubble{
  position:fixed;
  max-width:240px;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(10,20,40,.95);
  color:#d8f6ff;
  font-family:'Inter',sans-serif;
  font-size:13px;
  line-height:1.5;
  box-shadow:0 10px 30px rgba(0,180,255,.15);
  opacity:0;
  transform:translateY(10px) scale(.95);
  transition:.25s ease;
  z-index:9999;
}

.chat-bubble.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

/* tail */
.chat-bubble::after{
  content:'';
  position:absolute;
  left:-6px;
  top:50%;
  transform:translateY(-50%);
  border:6px solid transparent;
  border-right-color:rgba(10,20,40,.95);
}

.chat-bubble.right::after{
  left:auto;
  right:-6px;
  border-right-color:transparent;
  border-left-color:rgba(10,20,40,.95);
}

/* typing cursor */
.cursor{
  display:inline-block;
  width:6px;
  height:12px;
  background:#00dcff;
  margin-left:2px;
  animation:blink .7s step-end infinite;
}

@keyframes blink{
  50%{opacity:0;}
}
</style>
</head>

<body>

<div class="cleo-wrap">

  <!-- CHAT -->
  <div class="chat-bubble" id="chatBubble">
    <span id="typedText"></span><span class="cursor" id="cursor"></span>
  </div>

  <!-- CLEO (UNCHANGED — PASTE YOUR ORIGINAL SVG HERE) -->
  <div class="cleo-inner" id="cleoInner">

    <div class="cleo-svg-wrap">
      <!-- YOUR ORIGINAL CLEO SVG GOES HERE (UNCHANGED) -->
    </div>

    <div class="cleo-name">CLEO</div>
  </div>
</div>

<script>

/* ── MESSAGES ── */
const messages = [
  "Hi there 👋 I’m CLEO.",
  "Need help with anything?",
  "I’m here if you’re exploring something.",
  "Hello again ✨",
  "What are we working on today?",
  "I’ve got you covered.",
  "Ask me anything."
];

let lastMessageIndex = -1;

/* ── ELEMENTS ── */
const bubble = document.getElementById('chatBubble');
const cleo = document.getElementById('cleoInner');
const typed = document.getElementById('typedText');
const cursor = document.getElementById('cursor');

/* ── TYPING ENGINE ── */
let segMap = [];
let i = 0;
let typingTimer;

function buildMessage(text){
  segMap = [...text];
  i = 0;
  typed.innerHTML = "";
  typed.appendChild(cursor);
  cursor.style.display = "inline-block";
}

function typeNext(){
  if(i >= segMap.length){
    cursor.style.display = "none";
    return;
  }

  const ch = segMap[i++];

  const span = document.createElement("span");
  span.textContent = ch;

  typed.insertBefore(span, cursor);

  typingTimer = setTimeout(typeNext, 25 + Math.random()*25);
}

/* ── POSITIONING ── */
function positionBubble(){
  const r = cleo.getBoundingClientRect();
  const bw = 240;
  const margin = 12;

  const spaceRight = window.innerWidth - r.right;

  if(spaceRight > bw + margin){
    bubble.style.left = (r.right + margin) + 'px';
    bubble.classList.remove("right");
  } else {
    bubble.style.left = (r.left - bw - margin) + 'px';
    bubble.classList.add("right");
  }

  bubble.style.top = (r.top + r.height/2 - 60) + 'px';
}

/* ── SHOW / HIDE ── */
let hideTimer;

function show(){
  clearTimeout(hideTimer);

  positionBubble();
  bubble.classList.add("show");

  // pick new message (no repeat)
  let idx;
  do {
    idx = Math.floor(Math.random() * messages.length);
  } while(idx === lastMessageIndex && messages.length > 1);

  lastMessageIndex = idx;

  buildMessage(messages[idx]);

  clearTimeout(typingTimer);
  setTimeout(typeNext, 250);
}

function hide(){
  hideTimer = setTimeout(()=>{
    bubble.classList.remove("show");
  }, 400);
}

/* ── EVENTS ── */
cleo.addEventListener("mouseenter", show);
cleo.addEventListener("mouseleave", hide);
bubble.addEventListener("mouseenter", ()=>clearTimeout(hideTimer));
bubble.addEventListener("mouseleave", hide);

/* ── SUBTLE FOLLOW MOTION ── */
cleo.addEventListener('mousemove',(e)=>{
  const x=(e.clientX-window.innerWidth/2)*0.01;
  const y=(e.clientY-window.innerHeight/2)*0.01;
  bubble.style.transform=`translate(${x}px,${y}px) scale(1)`;
});

</script>

</body>
</html>
