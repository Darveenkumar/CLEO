<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEO</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:visible;width:100%;padding-top:50px;}

/* ── CLEO FLOAT ── */
.cleo-wrap{
  width:100%;
  display:flex;
  justify-content:center;
}

.cleo-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:hoverfloat 4s 1s ease-in-out infinite;
  cursor:pointer;
  width:160px;
}

@keyframes hoverfloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.cleo-name{
  font-family:'Syne',sans-serif;
  font-size:13px;
  letter-spacing:.1em;
  color:#00dcff;
  margin-top:6px;
}

/* ── SOFT SPEECH BUBBLE ── */
.chat-bubble{
  position:fixed;
  max-width:240px;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(10,20,40,.95);
  color:#d8f6ff;
  font-family:'Inter',sans-serif;
  font-size:13px;
  line-height:1.5;
  box-shadow:0 10px 30px rgba(0,180,255,.15);
  opacity:0;
  transform:translateY(10px) scale(.95);
  transition:.25s ease;
  z-index:9999;
}

.chat-bubble.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

/* tail (default left) */
.chat-bubble::after{
  content:'';
  position:absolute;
  left:-6px;
  top:50%;
  transform:translateY(-50%);
  border:6px solid transparent;
  border-right-color:rgba(10,20,40,.95);
}

/* tail right (when flipped) */
.chat-bubble.right::after{
  left:auto;
  right:-6px;
  border-right-color:transparent;
  border-left-color:rgba(10,20,40,.95);
}

/* typing */
.cursor{
  display:inline-block;
  width:6px;
  height:12px;
  background:#00dcff;
  margin-left:2px;
  animation:blink .7s step-end infinite;
}

@keyframes blink{
  50%{opacity:0;}
}
</style>
</head>

<body>

<div class="cleo-wrap">

  <!-- CHAT -->
  <div class="chat-bubble" id="chatBubble">
    <span id="typedText"></span><span class="cursor" id="cursor"></span>
  </div>

  <!-- CLEO -->
  <div class="cleo-inner" id="cleoInner">

    <div style="width:110px;">
      <!-- (your SVG unchanged) -->
      <svg viewBox="0 0 220 280" width="100%">
        <circle cx="110" cy="140" r="80" fill="#90c8e8"/>
      </svg>
    </div>

    <div class="cleo-name">CLEO</div>

  </div>
</div>

<script>
// ── TYPING TEXT ──
const text = "Hi there 👋 I'm CLEO, your compliance assistant.";
let i = 0;

function type(){
  if(i < text.length){
    document.getElementById("typedText").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 30 + Math.random()*30);
  } else {
    document.getElementById("cursor").style.display = "none";
  }
}

// ── POSITIONING ──
const bubble = document.getElementById('chatBubble');
const cleo = document.getElementById('cleoInner');

function positionBubble(){
  const r = cleo.getBoundingClientRect();
  const bw = 240;
  const margin = 12;

  const spaceRight = window.innerWidth - r.right;

  if(spaceRight > bw + margin){
    bubble.style.left = (r.right + margin) + 'px';
    bubble.classList.remove("right");
  } else {
    bubble.style.left = (r.left - bw - margin) + 'px';
    bubble.classList.add("right");
  }

  bubble.style.top = (r.top + r.height/2 - 60) + 'px';
}

// ── SHOW / HIDE ──
let started = false;
let hideTimer;

function show(){
  clearTimeout(hideTimer);
  positionBubble();
  bubble.classList.add("show");

  if(!started){
    started = true;
    setTimeout(type, 300);
  }
}

function hide(){
  hideTimer = setTimeout(()=>{
    bubble.classList.remove("show");
  }, 400);
}

// ── INTERACTION ──
cleo.addEventListener("mouseenter", show);
cleo.addEventListener("mouseleave", hide);
bubble.addEventListener("mouseenter", ()=>clearTimeout(hideTimer));
bubble.addEventListener("mouseleave", hide);

// ── SUBTLE FLOAT REACTION ──
cleo.addEventListener('mousemove', (e) => {
  const x = (e.clientX - window.innerWidth/2) * 0.01;
  const y = (e.clientY - window.innerHeight/2) * 0.01;
  bubble.style.transform = `translate(${x}px, ${y}px) scale(1)`;
});
</script>

</body>
</html>
