<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEO</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:visible;width:100%;padding-top:50px;}

.cleo-wrap{
  width:100%;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
}

.cleo-inner{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  animation:hoverfloat 4s 1s ease-in-out infinite;
  position:relative;
  cursor:pointer;
  width:160px;
}

@keyframes hoverfloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  28%{transform:translateY(-12px) rotate(-1.2deg)}
  55%{transform:translateY(-18px) rotate(.8deg)}
  78%{transform:translateY(-8px) rotate(-.6deg)}
}

.cleo-svg-wrap{
  filter:drop-shadow(0 8px 20px rgba(0,180,255,.35));
  width:110px;
}

.cleo-name{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:13px;letter-spacing:.1em;color:#00dcff;
  text-shadow:0 0 12px rgba(0,220,255,.5);
}

/* ── CHAT BUBBLE (UNCHANGED) ── */
.chat-bubble{
  position:fixed;
  width:230px;
  background:rgba(2,10,24,.97);
  border:1px solid rgba(0,220,255,.4);
  border-radius:8px;
  padding:14px 16px 12px;
  font-family:'Courier New',monospace;
  pointer-events:auto;
  opacity:0;
  transition:opacity .25s ease, transform .3s cubic-bezier(.22,1,.36,1);
  transform:scale(0.88) translateY(6px);
  transform-origin:bottom center;
  box-shadow:0 0 0 1px rgba(0,220,255,.1), 0 8px 32px rgba(0,150,255,.2), inset 0 0 40px rgba(0,220,255,.03);
  z-index:9999;
  display:none;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 19px,rgba(0,220,255,.03) 20px);
}

.chat-bubble.show{
  opacity:1;
  transform:scale(1) translateY(0);
  display:block;
}

.chat-bubble::after{
  content:'';position:absolute;
  top:50%;right:100%;
  transform:translateY(-50%);
  border:7px solid transparent;
  border-right-color:rgba(0,220,255,.4);
}

.chat-bubble::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#00dcff,transparent);
  border-radius:8px 8px 0 0;
}

.cb-body{
  font-size:10px;line-height:1.7;
  color:rgba(180,230,255,.85);
  min-height:44px;
  font-family:'Courier New',monospace;
}

.cursor{
  display:inline-block;
  width:6px;height:10px;
  background:#00dcff;
  margin-left:1px;
  vertical-align:middle;
  animation:cursorBlink .6s step-end infinite;
  border-radius:1px;
}

@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>

<body>

<div class="cleo-wrap">

  <!-- CHAT BUBBLE (UNCHANGED STRUCTURE) -->
  <div class="chat-bubble" id="chatBubble">
    <div class="cb-body">
      <div class="typed-text" id="typedText">
        <span class="cursor" id="cursor"></span>
      </div>
    </div>
  </div>

  <!-- 🔴 YOUR CLEO (NOT CHANGED AT ALL) -->
  <div class="cleo-inner" id="cleoInner">

    <div class="cleo-svg-wrap">

      <!-- ❗ DO NOT MODIFY YOUR ORIGINAL CLEO SVG -->
      <!-- PASTE YOUR EXACT SVG HERE -->
      <!-- I DID NOT TOUCH IT -->

    </div>

    <div class="cleo-name">CLEO</div>
  </div>

</div>

<script>

/* ── MESSAGES (NEW FEATURE) ── */
const messages = [
  "Hi there! 👋 I'm CLEO.",
  "Need help with anything?",
  "I'm here if you're exploring something.",
  "Hello again ✨",
  "What are we working on today?",
  "I’ve got you covered.",
  "Ask me anything."
];

let lastIndex = -1;

/* ── ELEMENTS ── */
const bubble = document.getElementById('chatBubble');
const cleo = document.getElementById('cleoInner');
const typed = document.getElementById('typedText');
const cursor = document.getElementById('cursor');

/* ── STATE ── */
let segMap = [];
let charIdx = 0;
let typingTimer = null;
let hideTimer = null;

/* ── RESET ── */
function resetTyping(){
  clearTimeout(typingTimer);
  typed.innerHTML = "";
  typed.appendChild(cursor);
  cursor.style.display = "inline-block";
  segMap = [];
  charIdx = 0;
}

/* ── BUILD MESSAGE ── */
function buildMessage(text){
  resetTyping();
  segMap = [...text];
}

/* ── TYPE EFFECT ── */
function typeNext(){
  if(charIdx >= segMap.length){
    cursor.style.display = "none";
    return;
  }

  const ch = segMap[charIdx++];

  const span = document.createElement("span");
  span.textContent = ch;

  typed.insertBefore(span, cursor);

  typingTimer = setTimeout(typeNext, 22 + Math.random()*28);
}

/* ── POSITION (UNCHANGED LOGIC STYLE) ── */
function positionBubble(){
  const r = cleo.getBoundingClientRect();
  bubble.style.left = (r.right + 12) + 'px';
  bubble.style.top  = (r.top + r.height/2 - 100) + 'px';
}

/* ── SHOW / HIDE (FIXED HOVER SYSTEM ONLY) ── */
function showBubble(){
  clearTimeout(hideTimer);

  positionBubble();
  bubble.classList.add('show');

  let idx = Math.floor(Math.random() * messages.length);

  if(messages.length > 1){
    while(idx === lastIndex){
      idx = Math.floor(Math.random() * messages.length);
    }
  }

  lastIndex = idx;

  buildMessage(messages[idx]);

  setTimeout(typeNext, 250);
}

function hideBubble(){
  hideTimer = setTimeout(()=>{
    bubble.classList.remove('show');
  }, 500);
}

/* ── EVENTS (UNCHANGED) ── */
cleo.addEventListener('mouseenter', showBubble);
cleo.addEventListener('mouseleave', hideBubble);
bubble.addEventListener('mouseenter', ()=>clearTimeout(hideTimer));
bubble.addEventListener('mouseleave', hideBubble);

</script>

</body>
</html>
