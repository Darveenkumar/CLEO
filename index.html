<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLEO Mascot Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Clean dark dashboard background for high contrast placement */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;
  min-height:100vh;
  background:#060913;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  overflow:hidden;
}

/* CLEO Widget Container */
.cleo-widget {
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px;
  width:320px;
}

.cleo-area {
  display:flex;
  justify-content:center;
  will-change:transform;
  position:relative;
  z-index:10;
}

.cleo-inner {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  animation:hoverfloat 4s ease-in-out infinite;
  position:relative;
  cursor:pointer;
}

@keyframes hoverfloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  28%{transform:translateY(-10px) rotate(-1deg)}
  55%{transform:translateY(-15px) rotate(0.8deg)}
  78%{transform:translateY(-6px) rotate(-0.5deg)}
}

.cleo-svg-wrap {
  filter:drop-shadow(0 12px 32px rgba(0,180,255,.32));
  width:130px;
}

/* Extracted Chat Bubble Style */
.chat-bubble {
  position:absolute;
  background:#0a0f24;
  border:1px solid rgba(0, 220, 255, 0.2);
  border-radius:12px;
  padding:10px 16px;
  min-width:140px;
  text-align:center;
  font-size:13px;
  color:#ffffff;
  box-shadow:0 8px 24px rgba(0,180,255,0.15);
  
  /* Positions bubble naturally above and slightly offset right */
  top:-15px;
  left:185px;
  
  opacity:0;
  transform:scale(0.9) translateY(10px);
  transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events:none;
  z-index:20;
}

/* Show state triggered via mouse hover classes */
.cleo-widget:hover .chat-bubble {
  opacity:1;
  transform:scale(1) translateY(0);
}

/* Speech Bubble Little Indicator Arrow */
.chat-bubble::before {
  content:'';
  position:absolute;
  left:-7px;
  top:50%;
  transform:translateY(-50%);
  border:7px solid transparent;
  border-right-color:rgba(0, 220, 255, 0.2);
  border-left:0;
}
.chat-bubble::after {
  content:'';
  position:absolute;
  left:-5.5px;
  top:50%;
  transform:translateY(-50%);
  border:7px solid transparent;
  border-right-color:#0a0f24;
  border-left:0;
}

/* Typing / Cursor Animation */
#typedText {
  font-weight:400;
  letter-spacing:0.02em;
}
#cursor {
  display:inline-block;
  width:2px;
  height:1.1em;
  background:#00dcff;
  vertical-align:text-bottom;
  margin-left:2px;
  animation:blink-cur .7s step-end infinite;
}
@keyframes blink-cur{0%,100%{opacity:1}50%{opacity:0}}

.cleo-name{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.22);margin-top:4px;}
.cleo-name span{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;color:#00dcff;}
</style>
</head>
<body>

<div class="cleo-widget" id="cleoWidget">
  
  <div class="chat-bubble" id="chatBubble">
    <span id="typedText"><span id="cursor"></span></span>
  </div>

  <div class="cleo-area" id="cleoArea">
    <div class="cleo-inner">
      <div class="cleo-svg-wrap">
        <svg viewBox="0 0 220 280" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%">
          <defs>
            <radialGradient id="bG" cx="38%" cy="28%" r="68%">
              <stop offset="0%" stop-color="#f2fbff"/>
              <stop offset="50%" stop-color="#cfeaf8"/>
              <stop offset="100%" stop-color="#8fc6e6"/>
            </radialGradient>
            <radialGradient id="hG" cx="36%" cy="26%" r="68%">
              <stop offset="0%" stop-color="#f4fcff"/>
              <stop offset="45%" stop-color="#bce3f8"/>
              <stop offset="100%" stop-color="#73bae2"/>
            </radialGradient>
            <radialGradient id="vG" gradientUnits="userSpaceOnUse" cx="92" cy="70" r="96">
              <stop offset="0%" stop-color="#1f63a8"/>
              <stop offset="50%" stop-color="#093058"/>
              <stop offset="100%" stop-color="#03102a"/>
            </radialGradient>
            <radialGradient id="eG" cx="38%" cy="32%" r="62%">
              <stop offset="0%" stop-color="#e8fffd"/>
              <stop offset="45%" stop-color="#62f0ff"/>
              <stop offset="100%" stop-color="#00b6dc"/>
            </radialGradient>
            <radialGradient id="ckG" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255,150,170,.75)"/>
              <stop offset="100%" stop-color="rgba(255,150,170,0)"/>
            </radialGradient>
            <radialGradient id="gG" cx="35%" cy="28%" r="65%">
              <stop offset="0%" stop-color="#ffe080"/>
              <stop offset="100%" stop-color="#c87800"/>
            </radialGradient>
            <radialGradient id="rG" cx="40%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#ff8a98"/>
              <stop offset="100%" stop-color="#d23344"/>
            </radialGradient>
            <linearGradient id="glG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,.55)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </linearGradient>
            <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="rgba(0,0,0,.32)"/></filter>
            <filter id="sh2"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,.22)"/></filter>
            <filter id="gw"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <clipPath id="visorClip"><rect x="48" y="54" width="124" height="62" rx="28"/></clipPath>
          </defs>

          <ellipse cx="110" cy="274" rx="50" ry="7" fill="rgba(0,180,255,.16)">
            <animate attributeName="rx" values="50;62;50" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".16;.26;.16" dur="4s" repeatCount="indefinite"/>
          </ellipse>

          <line x1="110" y1="18" x2="110" y2="9" stroke="#9fd8f0" stroke-width="3" stroke-linecap="round"/>
          <circle cx="110" cy="7" r="4.5" fill="#00dcff" filter="url(#gw)">
            <animate attributeName="r" values="4;5.4;4" dur="2.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".8;1;.8" dur="2.4s" repeatCount="indefinite"/>
          </circle>

          <path d="M55 168 Q50 232 52 268 L168 268 Q170 232 165 168 Q148 154 110 152 Q72 154 55 168Z" fill="url(#bG)" filter="url(#sh)"/>
          <path d="M72 158 Q110 150 148 158 Q142 172 110 174 Q78 172 72 158Z" fill="url(#glG)" opacity=".5"/>
          <path d="M64 182 Q110 174 156 182" stroke="rgba(160,240,255,.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <circle cx="84" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
          <circle cx="110" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
          <circle cx="136" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
          <circle cx="81" cy="207" r="3" fill="rgba(255,255,255,.6)"/>
          <circle cx="107" cy="207" r="3" fill="rgba(255,255,255,.6)"/>
          <circle cx="133" cy="207" r="3" fill="rgba(255,255,255,.6)"/>
          <rect x="82" y="234" width="56" height="20" rx="8" fill="rgba(0,100,200,.25)" stroke="rgba(0,220,255,.5)" stroke-width="1"/>
          <text x="110" y="248" text-anchor="middle" font-family="'Syne',sans-serif" font-size="9" font-weight="800" fill="#00dcff" letter-spacing="2.5">CLEO</text>

          <path d="M57 170 Q30 188 26 220 Q24 238 34 242 Q46 246 52 230 Q58 212 68 186Z" fill="url(#bG)" filter="url(#sh2)"/>
          <ellipse cx="12" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)" transform="matrix(-1 0 0 1 44 0)"/>
          <path d="M163 170 Q190 188 194 220 Q196 238 186 242 Q174 246 168 230 Q162 212 152 186Z" fill="url(#bG)" filter="url(#sh2)"/>
          <ellipse cx="188" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)"/>

          <ellipse cx="110" cy="153" rx="24" ry="6" fill="url(#gG)" filter="url(#sh2)"/>
          <rect x="94" y="134" width="32" height="22" rx="11" fill="url(#bG)" filter="url(#sh2)"/>

          <ellipse cx="110" cy="80" rx="71" ry="67" fill="url(#hG)" filter="url(#sh)"/>
          <ellipse cx="39" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/>
          <ellipse cx="181" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/>

          <rect x="48" y="54" width="124" height="62" rx="28" fill="url(#vG)"/>
          <rect x="48" y="54" width="124" height="62" rx="28" fill="none" stroke="rgba(120,210,255,.45)" stroke-width="1.5"/>

          <ellipse cx="66" cy="103" rx="9" ry="5.5" fill="url(#ckG)"/>
          <ellipse cx="154" cy="103" rx="9" ry="5.5" fill="url(#ckG)"/>

          <ellipse cx="84" cy="86" rx="15" ry="14" fill="white"/>
          <circle cx="84" cy="86" r="6" fill="#050200"/>
          <circle cx="87.5" cy="82" r="2.8" fill="rgba(255,255,255,.9)"/>
          <ellipse cx="84" cy="74" rx="15" ry="6" fill="rgba(0,0,0,.15)"/>

          <ellipse cx="136" cy="86" rx="15" ry="14" fill="white"/>
          <circle cx="136" cy="86" r="6" fill="#050200"/>
          <circle cx="139.5" cy="82" r="2.8" fill="rgba(255,255,255,.9)"/>
          <ellipse cx="136" cy="74" rx="15" ry="6" fill="rgba(0,0,0,.15)"/>

          <path d="M100 104 Q110 112 120 104" stroke="#5ef0ff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9"/>

          <ellipse id="lidLtop" cx="84"  cy="86" rx="15" ry="0" fill="url(#vG)"/>
          <ellipse id="lidLbot" cx="84"  cy="86" rx="15" ry="0" fill="url(#vG)"/>
          <ellipse id="lidRtop" cx="136" cy="86" rx="15" ry="0" fill="url(#vG)"/>
          <ellipse id="lidRbot" cx="136" cy="86" rx="15" ry="0" fill="url(#vG)"/>

          <g clip-path="url(#visorClip)">
            <ellipse cx="86" cy="64" rx="30" ry="10" fill="rgba(255,255,255,.16)" transform="rotate(-6 86 64)"/>
          </g>
        </svg>
      </div>
      <div class="cleo-name"><span>CLEO</span></div>
    </div>
  </div>

</div>

<script>
// --- Blinking Loop Configuration ---
function blink() {
  const closeSteps = 7, openSteps = 12, closeDur = 70, openDur = 150, maxRy = 14; 
  let f = 0;
  const eyes = [
    { top:'lidLtop', bot:'lidLbot', cx:84,  eyeTop:72, eyeBot:100 },
    { top:'lidRtop', bot:'lidRbot', cx:136, eyeTop:72, eyeBot:100 }
  ];
  const easeIn = t => t*t*t;
  const easeOut = t => 1-Math.pow(1-t,2.5);

  function setLids(progress) {
    const ry = progress * maxRy;
    eyes.forEach(e => {
      const tl = document.getElementById(e.top), bl = document.getElementById(e.bot);
      if(!tl||!bl) return;
      tl.setAttribute('rx', 15); tl.setAttribute('ry', ry); tl.setAttribute('cx', e.cx); tl.setAttribute('cy', e.eyeTop + ry);
      bl.setAttribute('rx', 15); bl.setAttribute('ry', ry * 0.6); bl.setAttribute('cx', e.cx); bl.setAttribute('cy', e.eyeBot - ry * 0.6);
    });
  }

  const ci = setInterval(() => {
    f++; setLids(easeIn(f / closeSteps));
    if (f >= closeSteps) {
      clearInterval(ci); f = 0;
      setTimeout(() => {
        const oi = setInterval(() => {
          f++; setLids(easeOut(1 - f / openSteps));
          if (f >= openSteps) { clearInterval(oi); setLids(0); setTimeout(blink, 2800 + Math.random() * 3500); }
        }, openDur / openSteps);
      }, 45);
    }
  }, closeDur / closeSteps);
}
setTimeout(blink, 2000);

// --- Local Cursor Tracking with Linear Decay Matrix ---
let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
let cleoCurrentX = 0, cleoTargetX = 0;
let isHovered = false;

const widget = document.getElementById('cleoWidget');
const cleoArea = document.getElementById('cleoArea');

window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

widget.addEventListener('mouseenter', () => { isHovered = true; triggerTyping(); });
widget.addEventListener('mouseleave', () => { isHovered = false; });

function moveCleo() {
  const rect = widget.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  
  if (isHovered) {
    // Relative calculation confined to widget scope
    const deltaX = mouseX - centerX;
    const maxAmplitude = 35; // Maximum tracking range bounds
    cleoTargetX = Math.max(-maxAmplitude, Math.min(maxAmplitude, deltaX * 0.25));
  } else {
    // Smooth linear decay back to absolute zero point (No popping)
    cleoTargetX = 0;
  }
  
  cleoCurrentX += (cleoTargetX - cleoCurrentX) * 0.07;
  cleoArea.style.transform = `translateX(${cleoCurrentX}px)`;
  requestAnimationFrame(moveCleo);
}
moveCleo();

// --- Interactive Dialogue Engine ---
const messages = ["Hi there! I'm CLEO", "Need a hand?", "Let's build!", "Systems active."];
let lastIndex = -1, segMap = [], charIdx = 0, typingTimer = null;

const typed = document.getElementById('typedText');
const cursor = document.getElementById('cursor');

function resetTyping() {
  clearTimeout(typingTimer);
  typed.innerHTML = '';
  typed.appendChild(cursor);
  cursor.style.display = 'inline-block';
  segMap = [];
  charIdx = 0;
}

function triggerTyping() {
  resetTyping();
  let idx = Math.floor(Math.random() * messages.length);
  while(idx === lastIndex) { idx = Math.floor(Math.random() * messages.length); }
  lastIndex = idx;
  segMap = [...messages[idx]];
  setTimeout(typeNext, 150);
}

function typeNext() {
  if (charIdx >= segMap.length) {
    cursor.style.display = 'none';
    return;
  }
  const ch = segMap[charIdx++];
  const span = document.createElement('span');
  span.textContent = ch;
  typed.insertBefore(span, cursor);
  typingTimer = setTimeout(typeNext, 30 + Math.random() * 30);
}
</script>
</body>
</html>
