<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Root Fallback variables to ensure perfect local rendering */
:root {
  --color-background-tertiary: #060913;
  --color-background-primary: #0a0f24;
  --color-border-secondary: rgba(0, 220, 255, 0.15);
  --color-text-primary: #ffffff;
  --border-radius-lg: 16px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;
  background:
    radial-gradient(130% 52% at 50% -10%, rgba(0,190,255,.16) 0%, rgba(0,150,255,.05) 40%, rgba(0,150,255,0) 72%),
    var(--color-background-tertiary);
  font-family:'Inter',sans-serif;overflow:hidden;color:var(--color-text-primary);}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3}

.page{
  position:relative;z-index:10;
  width:100%;min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:0 clamp(24px,5vw,72px) clamp(16px,3vw,44px);
  padding-top:0;
}

/* icon layer — behind everything */
#icon-layer{position:fixed;inset:0;pointer-events:none;z-index:11;}
.ficon{position:absolute;display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:none;border:none;}
.ficon svg{width:22px;height:22px;}

/* CLEO — frontmost */
.cleo-wrap{
  display:flex;justify-content:center;
  padding-top:clamp(16px,2vh,24px);
  position:relative;
  z-index:9999;
  width:100%;
  margin-bottom:-10px;
}
.cleo-area{
  display:flex;justify-content:center;
  will-change:transform;
  position:relative;
  z-index:9999;
}
.cleo-inner{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  animation:hoverfloat 4s 1s ease-in-out infinite;
  position:relative;
  z-index:9999;
  cursor:pointer;
}
@keyframes hoverfloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  28%{transform:translateY(-12px) rotate(-1.2deg)}
  55%{transform:translateY(-18px) rotate(.8deg)}
  78%{transform:translateY(-8px) rotate(-.6deg)}
}
.cleo-svg-wrap{
  filter:drop-shadow(0 12px 32px rgba(0,180,255,.32));
  width:clamp(88px,9vw,125px);
}
.cleo-name{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;gap:2px;}
.cleo-name span{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(11px,1vw,14px);letter-spacing:.1em;color:#00dcff;}

/* wordmark — always centred */
.wordmark-section{
  position:relative;
  animation:fadeUp .8s .2s both;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.wordmark{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(64px,12vw,150px);
  line-height:.88;letter-spacing:-.04em;
  display:flex;align-items:baseline;gap:clamp(6px,.8vw,14px);
  white-space:nowrap;
}
.wm-core{
  background:linear-gradient(120deg,#00e5ff,#00b4ff,#7b8cff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200% 100%;animation:shimmer 6s linear infinite;
}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.wm-hub{color:rgba(255,255,255,.72);font-weight:700;}

.tagline-row{
  margin-top:12px;
  display:flex;align-items:baseline;justify-content:space-between;
  animation:fadeUp .8s .4s both;
  width:100%;
}
.tag-left{font-size:clamp(11px,1.1vw,14px);color:rgba(255,255,255,.55);font-weight:300;letter-spacing:.04em;white-space:nowrap;margin-left:8px;}
.tag-left strong{color:rgba(0,220,255,.7);font-weight:400}
.tag-right{font-size:clamp(11px,1.1vw,14px);color:rgba(255,255,255,.55);font-weight:300;letter-spacing:.04em;white-space:nowrap;}
</style>
</head>

<script>
function blink() {
  const closeSteps = 7, openSteps = 12;
  const closeDur = 70, openDur = 150;
  const maxRy = 14; 
  let f = 0;

  const eyes = [
    { top:'lidLtop', bot:'lidLbot', cx:84,  eyeTop:72, eyeBot:100, eyeCY:86 },
    { top:'lidRtop', bot:'lidRbot', cx:136, eyeTop:72, eyeBot:100, eyeCY:86 },
  ];

  function easeIn(t){ return t*t*t; }
  function easeOut(t){ return 1-Math.pow(1-t,2.5); }

  function setLids(progress) {
    const ry = progress * maxRy;
    eyes.forEach(e => {
      const tl = document.getElementById(e.top);
      const bl = document.getElementById(e.bot);
      if(!tl||!bl) return;
      tl.setAttribute('rx', 15);
      tl.setAttribute('ry', ry);
      tl.setAttribute('cx', e.cx);
      tl.setAttribute('cy', e.eyeTop + ry);
      bl.setAttribute('rx', 15);
      bl.setAttribute('ry', ry * 0.6);
      bl.setAttribute('cx', e.cx);
      bl.setAttribute('cy', e.eyeBot - ry * 0.6);
    });
  }

  const ci = setInterval(() => {
    f++;
    setLids(easeIn(f / closeSteps));
    if (f >= closeSteps) {
      clearInterval(ci); f = 0;
      setTimeout(() => {
        const oi = setInterval(() => {
          f++;
          setLids(easeOut(1 - f / openSteps));
          if (f >= openSteps) {
            clearInterval(oi);
            setLids(0);
            setTimeout(blink, 2800 + Math.random() * 3500);
          }
        }, openDur / openSteps);
      }, 45);
    }
  }, closeDur / closeSteps);
}
setTimeout(blink, 2000);

const iconDefs = [
  {color:'#00dcff',svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#00dcff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1"/></svg>`},
  {color:'#4dffa0',svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#4dffa0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`},
  {color:'#7b8cff',svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#7b8cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`},
  {color:'#f0c060',svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#f0c060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`},
  {color:'#ff6b6b',svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`},
  {color:'#c084fc',svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>`},
];

const layer = document.getElementById('icon-layer');
const SIZE = 32, REPEL=140, FORCE=7, FRIC=0.86, SPRING=0.055;
let mouseX=window.innerWidth/2, mouseY=0, cleoCurrentX=0, cleoTargetX=0;
const cleoArea=document.getElementById('cleoArea');

document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

/* *** SMOOTH RETURN FIXED HERE ***
  Instead of hard-resetting to 0 when the mouse falls below the threshold,
  we simply set the cleoTargetX to 0. The existing linear interpolation loop 
  (cleoCurrentX += ...) will safely take over, pulling it back to the absolute 
  center with a gorgeous, feather-light decay animation.
*/
function moveCleo() {
  const cleoW = cleoArea.offsetWidth || 120;
  const amp = Math.max(60, window.innerWidth / 2 - cleoW / 2 - 24);
  const wmSection = document.getElementById('wmSection');
  
  if (wmSection) {
    const wmTop = wmSection.getBoundingClientRect().top;
    if (mouseY < wmTop) {
      cleoTargetX = ((mouseX / window.innerWidth) * 2 - 1) * amp;
    } else {
      cleoTargetX = 0; // Seamlessly decay to 0 instead of popping!
    }
  }
  
  cleoCurrentX += (cleoTargetX - cleoCurrentX) * 0.07;
  cleoArea.style.transform = `translateX(${cleoCurrentX}px)`;
  requestAnimationFrame(moveCleo);
}
moveCleo();

const fixedPos=[[0.07,10],[0.18,45],[0.30,25],[0.70,20],[0.82,45],[0.93,12]];
let particles = [];

function initParticles(){
  layer.innerHTML=''; particles=[];
  const wm=document.getElementById('wmSection');
  if(!wm)return;
  const wmR=wm.getBoundingClientRect();
  const cleoR=document.getElementById('cleoInner').getBoundingClientRect();
  const cleoCY=cleoR.top+cleoR.height*0.42;
  fixedPos.forEach(([xr,yo],i)=>{
    const ox=wmR.left+wmR.width*xr, oy=cleoCY+yo;
    const el=document.createElement('div');
    el.className='ficon';
    el.innerHTML=iconDefs[i].svg;
    el.style.left=(ox-SIZE/2)+'px';
    el.style.top=(oy-SIZE/2)+'px';
    el.style.opacity='0.55';
    layer.appendChild(el);
    particles.push({el,ox,oy,x:ox,y:oy,vx:0,vy:0});
  });
}

let cleoSX=0,cleoSY=0;
function loop(){
  const r=cleoArea.getBoundingClientRect();
  cleoSX=r.left+r.width/2; cleoSY=r.top+r.height*0.42;
  particles.forEach(p=>{
    const dx=p.x-cleoSX,dy=p.y-cleoSY,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<REPEL&&dist>1){const f=(REPEL-dist)/REPEL*FORCE;p.vx+=(dx/dist)*f;p.vy+=(dy/dist)*f;}
    p.vx+=(p.ox-p.x)*SPRING; p.vy+=(p.oy-p.y)*SPRING;
    p.vx*=FRIC; p.vy*=FRIC; p.x+=p.vx; p.y+=p.vy;
    p.el.style.left=(p.x-SIZE/2)+'px'; p.el.style.top=(p.y-SIZE/2)+'px';
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    p.el.style.opacity=0.45+Math.min(spd*0.05,0.55);
    p.el.style.transform=`scale(${1+Math.min(spd*0.03,0.2)})`;
  });
  requestAnimationFrame(loop);
}

initParticles();
setTimeout(initParticles,350);
window.addEventListener('resize',initParticles);
loop();

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,pts=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;pts=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.3+.3,a:Math.random()}));}
resize();window.addEventListener('resize',resize);
function drawCanvas(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,200,255,${p.a*.2})`;ctx.fill();});
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(0,180,220,${.05*(1-d/110)})`;ctx.lineWidth=.5;ctx.stroke();}}
  requestAnimationFrame(drawCanvas);
}
